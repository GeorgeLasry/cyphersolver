name: Solution
description: A solution to a cipher already in the ledger (catalogue entry, partial or unsolved write-up, open item in the notes).
title: "Solution: <target>"
labels: [contribution, solution]
body:
  - type: input
    id: target
    attributes:
      label: Target
      description: Catalogue number, write-up page or folder name.
      placeholder: "catalogue 183 / dinteville1592.html / targets/dinteville1592"
    validations: {required: true}
  - type: textarea
    id: documents
    attributes:
      label: Documents covered
      description: Shelfmark, folio, DECODE record numbers, and the images you worked from.
    validations: {required: true}
  - type: textarea
    id: key
    attributes:
      label: Key
      description: Sign-to-value table, code groups with values, nulls; the full improved key if you changed one. Attach a file if it is long.
    validations: {required: true}
  - type: textarea
    id: reading
    attributes:
      label: Decipherment (full texts)
      description: "Full texts, for every document claimed as read: the transcription of the ciphertext and the complete decryption (line by line against the ciphertext; mark unsure passages and unread groups). Attach files if long. They are shown on the write-up so the reading can be used and checked by others." 
    validations: {required: true}
  - type: textarea
    id: sentences
    attributes:
      label: Reading and English translation
      description: "For every document: the plaintext as coherent sentences in its own language (any language), holes marked in place ([...], [?word], [47] for an unidentified code), and an English translation with the same holes. A mechanical decryption is not a reading: if most sentences still have holes, go back to the images and the key, or send it marked 'decoded, not read'. A few holes are fine (George Lasry, 22 Oct 2026)."
    validations: {required: true}
  - type: dropdown
    id: method
    attributes:
      label: How the key was obtained
      options:
        - from the ciphertext alone
        - from plaintext beside the ciphertext (interlinear, margin, clear passages, same file)
        - from plaintext found elsewhere (edition, calendar, another archive)
        - an existing key, newly matched to this document
        - an existing key already known for this document
        - an existing decipherment, transcribed and checked
    validations: {required: true}
  - type: textarea
    id: prior
    attributes:
      label: Published before?
      description: Any earlier publication of this reading you know of. "None found" is a fine answer.
  - type: input
    id: credit
    attributes:
      label: How to credit you
      description: Name, initials or handle, and a link if you like.
  - type: textarea
    id: tools
    attributes:
      label: Tools
      description: Solvers, scripts, AI models used, if any.
