name: New cipher with solution
description: A ciphered document not yet in the ledger, with its key and decipherment.
title: "New cipher with solution: <archive, shelfmark>"
labels: [contribution, new cipher, solution]
body:
  - type: input
    id: shelfmark
    attributes:
      label: Archive, shelfmark and folio
    validations: {required: true}
  - type: input
    id: images
    attributes:
      label: Images
    validations: {required: true}
  - type: textarea
    id: context
    attributes:
      label: Date, sender, recipient, language
  - type: textarea
    id: key
    attributes:
      label: Key
    validations: {required: true}
  - type: textarea
    id: reading
    attributes:
      label: Decipherment (full texts)
      description: "Full texts, for every document claimed as read: the transcription of the ciphertext and the complete decryption (line by line against the ciphertext; mark unsure passages and unread groups). Attach files if long. They are shown on the write-up so the reading can be used and checked by others." 
    validations: {required: true}
  - type: textarea
    id: sentences
    attributes:
      label: Reading and English translation
      description: "For every document: the plaintext as coherent sentences in its own language (any language), holes marked in place ([...], [?word], [47] for an unidentified code), and an English translation with the same holes. A mechanical decryption is not a reading: if most sentences still have holes, go back to the images and the key, or send it marked 'decoded, not read'. A few holes are fine (George Lasry, 22 Oct 2026)."
    validations: {required: true}
  - type: textarea
    id: method
    attributes:
      label: How the key was obtained
    validations: {required: true}
  - type: dropdown
    id: publish
    attributes:
      label: May the reading be shown here in full?
      options:
        - yes, in full
        - note it as my unpublished solution only
    validations: {required: true}
  - type: input
    id: credit
    attributes:
      label: How to credit you
